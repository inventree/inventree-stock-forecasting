[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["inventree_forecasting"]

[tool.ruff.lint]
ignore = [
    # RUF012 - Mutable default value for class attribute.
    # Flags idiomatic Django/DRF patterns (permission_classes, Meta.fields, plugin
    # SETTINGS dicts) that are never mutated per-instance. Also ignored in the main
    # InvenTree repo's ruff config for the same reason.
    "RUF012",
]